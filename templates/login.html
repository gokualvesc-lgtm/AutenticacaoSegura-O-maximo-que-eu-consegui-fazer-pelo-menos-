<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form id="login-form" method="post" action="/login">
        <input type="email" placeholder="Seu e-mail" required name="email">
        <br><br>
        <input type="password" placeholder="Sua senha" required name="senha">
        <br><br>
        <button type="submit">Entrar</button>
    </form>
    <p>{{msg}}</p>

    <p><a href="/recuperacao">Esqueci minha senha</a></p>
    <p>Não tem conta? <a href="/register">Cadastre-se</a></p>
</body>
</html>
